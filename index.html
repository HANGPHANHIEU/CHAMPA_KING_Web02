<!DOCTYPE html>

<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Việc Gấp - Ứng dụng tìm việc nhanh</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome cho Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- File CSS riêng -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-white text-slate-800 h-screen flex overflow-hidden">

    <!-- KHUNG HIỂN THỊ CHÍNH - GIAO DIỆN "VIỆC GẤP" -->
    <main class="flex-1 bg-white text-slate-800 flex flex-col h-full overflow-hidden relative">
        
        <!-- Header Ứng dụng -->
        <header class="flex items-center justify-between px-6 py-4 border-b border-slate-100 bg-white">
            <div class="flex items-center space-x-2">
                <div class="text-[#0d9488] text-xl font-bold flex items-center">
                    <i class="fa-solid fa-bolt-lightning text-xl mr-1"></i>
                    <span class="text-slate-900 font-extrabold tracking-tight">việcgấp</span>
                    <span class="text-amber-500 text-lg ml-0.5">.</span>
                </div>
            </div>
            <div>
                <button id="btnPostJob" class="bg-[#0d9488] hover:bg-teal-700 text-white font-medium px-4 py-2 rounded-xl text-sm flex items-center shadow-sm transition">
                    <i class="fa-solid fa-plus mr-2"></i> Đăng việc gấp
                </button>
            </div>
        </header>

        <!-- Nội dung cuộn bên trong ứng dụng -->
        <div class="flex-1 overflow-y-auto px-6 py-5 pb-24">
            <!-- Tiêu đề trang -->
            <div class="mb-5">
                <h1 class="text-2xl font-bold text-slate-900 flex items-center">
                    Việc gần bạn 
                    <a href="#" class="ml-2 inline-flex items-center justify-center w-6 h-6 rounded-md bg-slate-100 text-slate-500 text-xs">
                        <i class="fa-solid fa-arrow-up-right-from-square"></i>
                    </a>
                </h1>
                <p class="text-sm text-slate-500 mt-0.5">Chọn việc phù hợp. Bắt đầu ngay hôm nay.</p>
                <div class="flex items-center text-xs text-slate-500 mt-2">
                    <span class="w-2 h-2 rounded-full bg-teal-600 inline-block mr-1.5"></span>
                    Các việc bên dưới là dữ liệu mẫu và việc tự đăng
                </div>
            </div>

            <!-- Banner nổi bật -->
            <div class="bg-gradient-to-r from-teal-800 via-teal-700 to-teal-900 rounded-2xl p-6 text-white relative overflow-hidden mb-6 shadow-md">
                <div class="absolute right-[-20px] bottom-[-20px] opacity-15 text-white text-9xl pointer-events-none">
                    <i class="fa-solid fa-bicycle"></i>
                </div>
                <div class="relative z-10 max-w-lg">
                    <span class="bg-amber-500 text-white text-[11px] font-semibold px-2.5 py-1 rounded-md inline-flex items-center mb-3 shadow-sm">
                        <i class="fa-solid fa-bolt mr-1"></i> Cần người ngay
                    </span>
                    <h2 class="text-xl md:text-2xl font-bold leading-snug mb-2">
                        Một chuyến giao hàng.<br>Một khoản thu nhập ngay.
                    </h2>
                    <p class="text-xs md:text-sm text-teal-100 mb-4 font-medium">
                        Quận 3 &bull; Trong 30 phút &bull; 180.000đ / chuyến
                    </p>
                    <button class="bg-white text-teal-900 hover:bg-teal-50 font-semibold px-4 py-2 rounded-xl text-xs flex items-center transition shadow">
                        Xem việc này <i class="fa-solid fa-arrow-right ml-2"></i>
                    </button>
                </div>
            </div>

            <!-- Thanh tìm kiếm và bộ lọc khu vực -->
            <div class="space-y-3 mb-5">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-slate-400 text-sm"></i>
                    <input type="text" id="searchInput" placeholder="Bạn muốn làm việc gì?" class="w-full bg-slate-50 border border-slate-200 rounded-xl py-3 pl-11 pr-4 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:border-teal-600 focus:bg-white transition">
                </div>
                <div class="relative">
                    <i class="fa-solid fa-location-dot absolute left-4 top-3.5 text-slate-500 text-sm"></i>
                    <select id="locationSelect" class="w-full bg-slate-50 border border-slate-200 rounded-xl py-3 pl-11 pr-8 text-sm text-slate-800 appearance-none focus:outline-none focus:border-teal-600 focus:bg-white transition cursor-pointer">
                        <option value="">Tất cả khu vực</option>
                        <option value="Quận 1">Quận 1</option>
                        <option value="Quận 3">Quận 3</option>
                        <option value="Quận 7">Quận 7</option>
                        <option value="Bình Thạnh">Bình Thạnh</option>
                    </select>
                    <i class="fa-solid fa-chevron-down absolute right-4 top-4 text-xs text-slate-400 pointer-events-none"></i>
                </div>
            </div>

            <!-- Danh mục dạng pills -->
            <div class="flex items-center space-x-2 overflow-x-auto pb-2 scrollbar-none mb-5" id="categoryContainer">
                <button data-category="all" class="category-btn bg-slate-900 text-white px-4 py-2 rounded-full text-xs font-medium whitespace-nowrap shadow-sm transition">Tất cả</button>
                <button data-category="delivery" class="category-btn bg-slate-100 hover:bg-slate-200 text-slate-600 px-4 py-2 rounded-full text-xs font-medium whitespace-nowrap transition">Giao hàng</button>
                <button data-category="cleaning" class="category-btn bg-slate-100 hover:bg-slate-200 text-slate-600 px-4 py-2 rounded-full text-xs font-medium whitespace-nowrap transition">Dọn dẹp</button>
                <button data-category="repair" class="category-btn bg-slate-100 hover:bg-slate-200 text-slate-600 px-4 py-2 rounded-full text-xs font-medium whitespace-nowrap transition">Sửa chữa</button>
                <button data-category="service" class="category-btn bg-slate-100 hover:bg-slate-200 text-slate-600 px-4 py-2 rounded-full text-xs font-medium whitespace-nowrap transition">Phục vụ</button>
            </div>

            <!-- Bộ lọc kết quả -->
            <div class="flex items-center justify-between mb-4">
                <span id="jobCount" class="text-sm font-bold text-slate-800">0 việc phù hợp</span>
                <div class="flex items-center space-x-4 text-xs text-slate-600">
                    <label class="flex items-center cursor-pointer">
                        <input type="checkbox" id="urgentCheck" class="rounded border-slate-300 text-teal-600 focus:ring-teal-500 mr-1.5 w-4 h-4">
                        Chỉ việc gấp
                    </label>
                </div>
            </div>

            <!-- KHU VỰC HIỂN THỊ DANH SÁCH VIỆC LÀM -->
            <div id="jobList" class="space-y-3">
                <!-- Các công việc sẽ được render tự động ở đây -->
            </div>
        </div>

        <!-- Thanh điều hướng dưới cùng -->
        <nav class="absolute bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-4 py-2.5 flex justify-around items-center z-10 shadow-lg">
            <a href="#" class="flex flex-col items-center text-[#0d9488]">
                <i class="fa-solid fa-magnifying-glass text-base mb-1"></i>
                <span class="text-[11px] font-medium">Tìm việc</span>
            </a>
            <a href="#" class="flex flex-col items-center text-slate-400 hover:text-slate-600 transition">
                <i class="fa-solid fa-briefcase text-base mb-1"></i>
                <span class="text-[11px]">Đã nhận</span>
            </a>
            <a href="#" class="flex flex-col items-center text-slate-400 hover:text-slate-600 transition">
                <i class="fa-solid fa-plus text-base mb-1"></i>
                <span class="text-[11px]">Đăng việc</span>
            </a>
        </nav>
    </main>

    <!-- MODAL ĐĂNG VIỆC (Form nhập thông tin) -->
    <div id="postJobModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl border border-slate-100 overflow-hidden">
            <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h3 class="font-bold text-slate-800 text-lg">Đăng công việc mới</h3>
                <button id="btnCloseModal" class="text-slate-400 hover:text-slate-600 text-2xl font-bold">&times;</button>
            </div>
            
            <form id="postJobForm" class="p-5 space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Tên công việc <span class="text-red-500">*</span></label>
                    <input type="text" id="jobTitleInput" required placeholder="Ví dụ: Giao hàng nhanh Quận 3..." class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-teal-600">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Khu vực</label>
                        <select id="jobLocationInput" class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-teal-600">
                            <option value="Quận 1">Quận 1</option>
                            <option value="Quận 3">Quận 3</option>
                            <option value="Quận 7">Quận 7</option>
                            <option value="Bình Thạnh">Bình Thạnh</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Danh mục</label>
                        <select id="jobCategoryInput" class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-teal-600">
                            <option value="delivery">Giao hàng</option>
                            <option value="cleaning">Dọn dẹp</option>
                            <option value="repair">Sửa chữa</option>
                            <option value="service">Phục vụ</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Mức lương</label>
                    <input type="text" id="jobSalaryInput" placeholder="Ví dụ: 180.000đ / chuyến" class="w-full px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-teal-600">
                </div>

                <div class="flex items-center gap-2 pt-1">
                    <input type="checkbox" id="jobUrgentInput" class="w-4 h-4 text-teal-600 rounded border-slate-300 focus:ring-teal-500">
                    <label for="jobUrgentInput" class="text-sm font-medium text-slate-700 cursor-pointer">Cần tuyển gấp (Gắn nhãn GẤP)</label>
                </div>

                <div class="pt-3 flex gap-2">
                    <button type="button" id="btnCancelModal" class="w-1/2 py-2.5 bg-slate-100 text-slate-700 font-medium rounded-xl hover:bg-slate-200 transition text-sm">Hủy</button>
                    <button type="submit" class="w-1/2 py-2.5 bg-[#0d9488] hover:bg-teal-700 text-white font-medium rounded-xl transition shadow-sm text-sm">Đăng ngay</button>
                </div>
            </form>
        </div>
    </div>

    <!-- File JavaScript riêng -->
    <script src="script.js"></script>
</body>
</html>
